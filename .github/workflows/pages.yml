name: Release ShizukuBot Pages

on:
  push:
    tags: ['shizukubot-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shizukubot-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Validate production API origin
        env:
          SHIZUKUBOT_BACKEND_ORIGIN: ${{ vars.SHIZUKUBOT_BACKEND_ORIGIN || vars.OURNOTES_BACKEND_ORIGIN }}
        run: node --input-type=module -e "const value=process.env.SHIZUKUBOT_BACKEND_ORIGIN||''; let url; try{url=new URL(value)}catch{throw Error('SHIZUKUBOT_BACKEND_ORIGIN is missing or invalid')} if(url.origin!==value||url.protocol!=='https:')throw Error('SHIZUKUBOT_BACKEND_ORIGIN must be an exact HTTPS origin')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build production bundle
        env:
          VITE_API_ORIGIN: ${{ vars.SHIZUKUBOT_BACKEND_ORIGIN || vars.OURNOTES_BACKEND_ORIGIN }}
        run: pnpm build
      - name: Check public bundle
        run: pnpm check:public
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
